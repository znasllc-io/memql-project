# bff-__PRODUCT__ -- the __PRODUCT__ product's OWN bff head.
#
# It is a plain, product-agnostic engine `bff` node (the engine `memql-bff`
# image, retargeted per-overlay) that fronts THIS product by mounting its DSL
# bundle at runtime. Two things make it the product bff and not the engine's
# neutral one:
#   1. label `memql/product-dsl: "true"` -- opts this Deployment into the
#      vendored dsl-bundle component, which adds the init-container that copies
#      the product's .memql tree to MEMQL_DSL_PATH; the plain engine image then
#      loads the product DSL with zero compiled-in product code.
#   2. a distinct name/Service `bff-__PRODUCT__` -- so it coexists as a peer with
#      the engine Application's neutral `bff` in the shared `memql` namespace
#      (the engine base ships the neutral bff via its engine-bff component; a
#      product brings its own labelled head -- see the engine
#      deploy/k8s/components/engine-bff/bff.yaml header).
#
# NO product code, NO product-specific engine image, NO pre-existing
# initContainers (the dsl-bundle component sets that array wholesale).
# imagePullPolicy/replicas and the image pin are set by the overlays.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-__PRODUCT__
  labels:
    app.kubernetes.io/name: bff-__PRODUCT__
    app.kubernetes.io/part-of: memql
    memql/node-type: bff
    memql/product-dsl: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff-__PRODUCT__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff-__PRODUCT__
        app.kubernetes.io/part-of: memql
        memql/node-type: bff
    spec:
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
      terminationGracePeriodSeconds: 45
      containers:
        - name: bff
          image: memql-bff # pinned by the overlay images: transformer
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50058 }
          envFrom:
            - secretRef:
                name: memql-secrets
            - configMapRef:
                name: memql-db-pool
            # THE DOMAIN ARRIVES HERE, NOT AS A PINNED VALUE (engine memql#3593).
            # memql-domain carries exactly one key, MEMQL_DOMAIN, seeded by the
            # ENGINE cluster's `make up DOMAIN=...` / `make secrets`. Every node
            # derives its identity base URL, the issuer it verifies against, the
            # discovery endpoint and the OAuth redirect URIs from it at boot
            # (component/envregistry/domain.go), so the product head and the
            # engine mesh cannot disagree about the domain -- which is the
            # failure this replaces: a stamped-once issuer that silently stops
            # matching the moment the engine cluster is re-seeded with a
            # different domain, and then rejects every token while this manifest
            # still looks correct.
            #
            # NOT `optional: true`, matching the engine: a node with no domain
            # would derive nothing, boot, join the mesh and reject every token
            # with an error naming neither the domain nor this ConfigMap.
            # Refusing to start is the honest failure. Same hard dependency on
            # the engine cluster that memql-secrets above already is.
            - configMapRef:
                name: memql-domain
          env:
            # Env names carry the MEMQL_ prefix (engine memql#3892). The bare
            # SERVER_* / SERVICE_* spellings still work through the boot alias
            # shim (component/envregistry.ApplyLegacyEnvAliases) but log a
            # deprecation line on every node at every boot.
            - { name: MEMQL_SERVICE_NAME, value: "MemQL" }
            - { name: MEMQL_NODE_TYPE, value: "bff" }
            - { name: MEMQL_NODE_ADDRESS, value: "bff-__PRODUCT__:50058" }
            # Unique per-pod mesh identity: overrides the shared genesis
            # MEMQL_NODE_ID so PeerManager keys each pod distinctly.
            - { name: MEMQL_NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: MEMQL_DEPLOYMENT_ID, valueFrom: { fieldRef: { fieldPath: "metadata.labels['pod-template-hash']" } } }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50058" }
            # Reach the shared engine leaf nodes (owned by the engine Application).
            - { name: MEMQL_WORKER_PEERS, value: "voice=voice:50059,agent=agent:50055,cognition=cognition:50054,planner=planner:50056,workbench=workbench:50060" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: MEMQL_SERVER_ADDRESS, value: "0.0.0.0:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            # NO MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER HERE, DELIBERATELY. It is
            # derived from the memql-domain ConfigMap above, and an explicit `env`
            # entry BEATS `envFrom` in Kubernetes regardless of order -- so pinning
            # it would mount the ConfigMap and ignore it. The engine gates exactly
            # this on its own nodes (deploy/k8s/overlays/local/render_domain_test.go:
            # "still pins an expected issuer, which beats envFrom").
            # Authentication is ON everywhere, local and cloud alike -- env
            # parity (the engine's own engine-bff component sets "true" even
            # locally). The product bff is exposed by the cloud public-entry
            # (app.DOMAIN/memql WS + bff.DOMAIN raw gRPC), so it must verify
            # tokens like the neutral engine bff.
            - { name: MEMQL_IDENTITY_ENABLED, value: "true" }
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            # CORS allow-list for the product bff's HTTP/WS surface, and the ONE
            # domain-shaped value that is NOT derived from memql-domain -- the
            # derivation covers the identity/discovery/redirect set, not this.
            #
            # NEVER "*": the CORS middleware emits
            # `Access-Control-Allow-Credentials: true` ONLY when the allow-list is
            # explicit, and degrades to a credential-less posture under a wildcard
            # (component/server/nethttp.go). The bff is a CREDENTIALED API -- it
            # carries user bearer tokens -- so a wildcard here does not open it up,
            # it breaks it: every credentialed request from the SPA fails. Name the
            # origin.
            #
            # The base value is the front-door origin for the stamped domain
            # (app.DOMAIN, from product.env). The cloud overlay serves the SPA at
            # its own public host and so OVERRIDES this via its
            # identity-config.yaml patch (see the overlay activation checklist).
            - { name: MEMQL_SERVER_ALLOWED_ORIGINS, value: "https://app.__DOMAIN__" }
            # The memQL Portal is DELIBERATELY NOT SERVED by the product bff,
            # and there is no longer an env var that could make it be.
            #
            # The portal is the PLATFORM's operations console, not a product
            # surface. Since engine memql#3711 it is site #1: an ordinary hosted
            # site served by the engine's `edge` node at portal.<domain>, resolved
            # by hostname to a v1:platform:site row whose bundleRef names the
            # directory the bytes live in. component/portal is retired and
            # MEMQL_PORTAL_DIST with it, so there is nothing to set here -- the
            # engine Application owns the edge node, the site row and the
            # portal front-door rule.
            # Shared DB -- migrations run once on the engine identity node.
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: 8085 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: 8085 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: { cpu: 200m, memory: 256Mi }
---
# In-mesh + front-door target for the product bff (gRPC 50051, HTTP/WS 8085,
# node 50058). The SPA reaches it through the front door; native gRPC clients
# reach it at bff.__DOMAIN__.
apiVersion: v1
kind: Service
metadata:
  name: bff-__PRODUCT__
  labels:
    app.kubernetes.io/name: bff-__PRODUCT__
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff-__PRODUCT__
  ports:
    - { name: node, port: 50058, targetPort: 50058 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
