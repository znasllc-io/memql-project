# __PRODUCT__-web -- the "web" client surface (clients/web/), served in-cluster.
#
# ONE FILE PER SURFACE. A product is a DSL bundle plus one or more client
# surfaces (clients/README.md), and kustomize does not template, so each
# surface gets its own `clients-<name>.yaml` here and its own entry in
# kustomization.yaml. The naming rule every layer derives from is
# `<product>-<surface>`: the Deployment, the Service, the image, the kustomize
# image key, and the release-lockfile component all use it.
#
# The starter surface image (clients/web/Dockerfile) is a static server: `serve
# -s dist -l 8080` serves the built Vite bundle. The browser-facing config
# (VITE_MEMQL_HTTP_URL, VITE_IDENTITY_BASE_URL) is baked at build time, so the
# running container needs no runtime env. The overlays pin the image (local ->
# a k3d-imported `__PRODUCT__-web:local`, cloud -> a digest-pinned registry
# image). The front door routes `/` here and `/memql` to bff-__PRODUCT__; a
# second surface takes its own hostname or path prefix.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __PRODUCT__-web
  labels:
    app.kubernetes.io/name: __PRODUCT__-web
    app.kubernetes.io/component: client
    app.kubernetes.io/part-of: memql
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: __PRODUCT__-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __PRODUCT__-web
        app.kubernetes.io/component: client
        app.kubernetes.io/part-of: memql
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: __PRODUCT__-web # pinned by the overlay images: transformer
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: __PRODUCT__-web
  labels:
    app.kubernetes.io/name: __PRODUCT__-web
    app.kubernetes.io/component: client
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: __PRODUCT__-web
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
