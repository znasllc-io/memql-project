# __PRODUCT__ front door on the local k3d cluster. traefik terminates TLS on
# 443 with the operator's mkcert wildcard (memql-front-door-tls, seeded
# engine-side by `make -C ../memql up`) and routes by hostname:
#   https://bff.__DOMAIN__  -> the product bff's HTTP surface (the /memql/ws
#                              bridge the SPA consumes).
#   https://app.__DOMAIN__  -> the in-cluster `web` client surface, with the same
#                              path-routing as the deployed public entry:
#                              /memql -> the product bff,
#                              the auth paths -> identity, / -> __PRODUCT__-web.
# A SECOND client surface (clients/README.md) takes its own host rule here (e.g.
# game.__DOMAIN__ -> __PRODUCT__-game) or its own longer path prefix.
# identity is an engine service (owned by the engine Application); an
# Ingress routes to any Service in the namespace by name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bff-front-door
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: ["bff.__DOMAIN__"]
      secretName: memql-front-door-tls
  rules:
    - host: bff.__DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff-__PRODUCT__
                port:
                  number: 8085
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-front-door
  # NO router.priority here, deliberately. traefik's default priority is derived
  # from rule LENGTH, which is what makes each of these exact-host rules outrank
  # a shorter wildcard. A uniform priority on an Ingress that declares several
  # paths flattens them against each other and the longest-prefix match stops
  # working (the engine measured this in memql#3810). Do not "fix" this by
  # adding one.
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts: ["app.__DOMAIN__"]
      secretName: memql-front-door-tls
  rules:
    - host: app.__DOMAIN__
      http:
        paths:
          - { path: /memql, pathType: Prefix, backend: { service: { name: bff-__PRODUCT__, port: { number: 8085 } } } }
          - { path: /auth/refresh, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
          - { path: /auth/logout, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
          - { path: /oauth/token, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
          - { path: /.well-known/jwks.json, pathType: Prefix, backend: { service: { name: identity, port: { number: 8085 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: __PRODUCT__-web, port: { number: 8080 } } } }
