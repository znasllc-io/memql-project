# __PRODUCT__ LOCAL overlay -- the product Application (`__PRODUCT__-local`) for
# the local k3d stack. It owns ONLY product resources: the bff head + every
# client surface (../../base), the runtime DSL-bundle delivery (the vendored
# dsl-bundle component), and the traefik front door. The engine mesh is the SEPARATE
# `memql-local` Application registered by `make -C ../memql up`.
#
# Local image discipline (mirrors the engine's local overlay): mutable `:local`
# tags + IfNotPresent, because images are `k3d image import`ed, never pulled
# from a registry. No digest pins here (the cloud overlay pins by digest). Works
# with REGISTRY unset -- there is no registry in the local flow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: memql

resources:
  - ../../base
  - front-door.yaml

components:
  - ../../components/dsl-bundle

images:
  # The engine bff image the product bff runs: built + imported by
  # `make -C ../memql up` as memql-bff:local.
  - name: memql-bff
    newName: memql-bff
    newTag: local
  # The product's DSL bundle: built from dsl/ + deploy/Dockerfile.bundle and
  # imported by the root `make up` as __PRODUCT__-dsl-bundle:local.
  - name: memql-dsl-bundle
    newName: __PRODUCT__-dsl-bundle
    newTag: local
  # One pin PER CLIENT SURFACE (clients/README.md): built from clients/<name>/
  # and imported as __PRODUCT__-<name>:local by the root `make up`. A second
  # surface adds a second block here.
  - name: __PRODUCT__-web
    newName: __PRODUCT__-web
    newTag: local
