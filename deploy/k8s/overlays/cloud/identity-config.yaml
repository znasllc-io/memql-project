# CLOUD CORS patch point (B2/C13). A strategic-merge patch overriding the ONE
# public-host value the product bff cannot derive: its CORS allow-list origin.
#
# WHY ONLY ONE VALUE NOW. The expected token issuer used to be patched here too.
# It is no longer set anywhere: since engine memql#3593 every node derives it
# from the single MEMQL_DOMAIN key of the engine-seeded `memql-domain`
# ConfigMap, which ../../base/bff.yaml mounts via envFrom. An explicit `env`
# entry beats `envFrom` regardless of order, so re-pinning the issuer here would
# mount the ConfigMap and ignore it -- the exact mistake the engine gates
# against on its own nodes.
#
# MEMQL_SERVER_ALLOWED_ORIGINS is NOT part of that derivation (the derived
# MEMQL_IDENTITY_CORS_ALLOWED_ORIGINS is identity's own list, a different
# variable), so the SPA's public origin still has to be stated -- here.
#
# NEVER wildcard it: the middleware emits Access-Control-Allow-Credentials only
# for an explicit allow-list, and the bff is a credentialed API.
#
# PLACEHOLDER -- set to the real app origin (and align the public-entry.yaml
# hostnames + ACME email to the same domain) before pointing an ArgoCD
# Application at this overlay. A second instance has its own domain, and
# therefore its own overlay with its own copy of this value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-__PRODUCT__
spec:
  template:
    spec:
      containers:
        - name: bff
          env:
            - name: MEMQL_SERVER_ALLOWED_ORIGINS
              value: "https://app.example.com"
